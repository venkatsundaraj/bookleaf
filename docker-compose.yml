# The database is external (managed Postgres). Secrets come from the shell
# (or the hosting platform's env settings) at `docker compose up` time.
services:
  server:
    build:
      context: ./server
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CLASSIFY_MODEL: ${OPENAI_CLASSIFY_MODEL:-gpt-4o-mini}
      OPENAI_DRAFT_MODEL: ${OPENAI_DRAFT_MODEL:-gpt-4o-mini}
      NODE_ENV: production
      PORT: 8000
    ports:
      - "8000:8000"
    restart: unless-stopped

  client:
    build:
      context: ./client
      args:
        # Baked into the /api rewrite at build time.
        BACKEND_URL: http://server:8000
    environment:
      # Read at request time by server components.
      BACKEND_URL: http://server:8000
    ports:
      - "3000:3000"
    depends_on:
      - server
    restart: unless-stopped
